<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="RipDisc logo">
  <!-- film strip frame, the same as flyweight's icon -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#111216"/>
  <g fill="#e9e9ee">
    <rect x="46" y="62" width="34" height="44" rx="9"/><rect x="46" y="164" width="34" height="44" rx="9"/>
    <rect x="46" y="266" width="34" height="44" rx="9"/><rect x="46" y="368" width="34" height="44" rx="9"/>
    <rect x="432" y="62" width="34" height="44" rx="9"/><rect x="432" y="164" width="34" height="44" rx="9"/>
    <rect x="432" y="266" width="34" height="44" rx="9"/><rect x="432" y="368" width="34" height="44" rx="9"/>
  </g>
  <rect x="104" y="40" width="304" height="432" rx="20" fill="#ffd21f"/>
  <!-- CD: black disc, yellow hub ring and centre hole -->
  <circle cx="256" cy="256" r="128" fill="#111"/>
  <circle cx="256" cy="256" r="44" fill="none" stroke="#ffd21f" stroke-width="6"/>
  <circle cx="256" cy="256" r="20" fill="#ffd21f"/>
</svg>
